[package]
name = "curalit"
version = "0.4.2"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A tool for creating custom LLMs from PubMed literature for local research"
license = "MIT"
repository = "https://github.com/yourusername/curalit"
keywords = ["pubmed", "llm", "medical", "research", "ollama"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "curalit"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"

# XML parsing (streaming for large files)
quick-xml = { version = "0.36", features = ["serialize", "overlapped-lists"] }
serde = { version = "1.0", features = ["derive"] }

# CSV handling
csv = "1.3"

# Progress bars and terminal colors
indicatif = { version = "0.17", features = ["rayon"] }
colored = "2.1"
console = "0.15"

# File and path handling
walkdir = "2.5"
glob = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Statistics and analysis
statrs = "0.17"

# Parallel processing
rayon = "1.10"

# String similarity for fuzzy matching
strsim = "0.11"

# Regex for pattern matching
regex = "1.10"

# JSON for configuration and output
serde_json = "1.0"

# Template engine for generating Python scripts
tera = "1.20"

# Archive creation (tar.gz and zip)
flate2 = "1.0"
tar = "0.4"
zip = "0.6"

# SQLite database for factual retrieval
rusqlite = { version = "0.32", features = ["bundled"] }

# RAG (Retrieval-Augmented Generation) dependencies
qdrant-client = "1.18"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
# Testing utilities
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
