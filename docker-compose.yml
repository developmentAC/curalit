services:
  curalit:
    # Pulled from Docker Hub by default. To build from this repo instead:
    #   docker compose build && docker compose up -d
    image: ${CURALIT_IMAGE:-obonhamcarter/curalit:0.4.4}
    build: .
    ports:
      - "127.0.0.1:5050:5050"     # browser UI, only reachable from this machine
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6334
    volumes:
      - ./data:/app/data          # put PubMed XML files here
      - ./0_out:/app/0_out        # results and reports
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_models:
