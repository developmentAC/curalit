[project]
name = "curalit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oliver Bonham-Carter", email = "obonhamcarter@allegheny.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyvis>=0.3.2",
    "seaborn>=0.13.2",
]

[project.scripts]
curalit = "curalit:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
